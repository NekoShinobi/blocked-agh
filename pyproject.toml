[project]
name = "blocked-agh"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
license-files = ["LICENSE"]
dependencies = [
    "aiohttp>=3.13.2",
    "starlette>=0.50.0",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3,<2",
    "httpx>=0.28.1,<1",
]

[project.urls]
Homepage = "https://github.com/xNinjaKittyx/blocked-agh"
Repository = "https://github.com/xNinjaKittyx/blocked-agh"
"Bug Tracker" = "https://github.com/xNinjaKittyx/blocked-agh/issues"

[project.scripts]
betavantage = "betavantage.main:main"
fetchdata = "betavantage.fetch_data:main"


[tool.ruff]
# Same as Black.
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Enable the pycodestyle (`E`) and Pyflakes (`F`) rules by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E", "F", "UP", "RUF"]
ignore = []
preview = true

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
per-file-ignores = {}

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
